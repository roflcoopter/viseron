default_language_version:
  python: python3

repos:
  - repo: https://github.com/cdce8p/python-typing-update
    rev: v0.9.0
    hooks:
      # Run `python-typing-update` hook manually:
      # pre-commit run --hook-stage manual python-typing-update --all-files
      - id: python-typing-update
        stages: [manual]
        args:
          - --py310-plus
          - --force
          - --keep-updates
        files: ^(viseron|tests)/.+\.py$

  # Python tools run from the active environment so it matches whatever is in
  # requirements_test.txt
  - repo: local
    hooks:
      - id: pyupgrade
        name: pyupgrade
        entry: pyupgrade
        language: system
        types: [python]
        args:
          - --py38-plus
          - --keep-runtime-typing
        files: ^(viseron|tests)/.+\.py$

      - id: autoflake
        name: autoflake
        entry: autoflake
        language: system
        types: [python]
        require_serial: true
        args:
          - --in-place
          - --remove-all-unused-imports
        files: ^(viseron|tests)/.+\.py$

      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types: [text]
        args:
          - --skip="./.*,*.csv,*.json"
          - --quiet-level=2
        exclude_types: [csv, json]
        exclude: ^tests/fixtures/

      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        require_serial: true
        files: ^(viseron|tests)/.+\.py$

      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
        args: [--fix]
        files: ^(viseron|tests|scripts)/.+\.py$

      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
        files: ^(viseron|tests|scripts)/.+\.py$

      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args: [
            "-rn", # Only display messages
            "-sn", # Don't display the score
            "--rcfile=.pylintrc", # Link to your config file
          ]
        files: ^(viseron|tests)/.+\.py$

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        files: ^(viseron)/.+\.py$
        require_serial: true

      - id: generate_docs
        description: Check if docs needs to be regenerated
        name: generate_docs
        language: system
        entry: python3 -m scripts.gen_docs -a
        pass_filenames: false
        always_run: true

      - id: check_config_json
        description: 'Fail if any config.json contains "description": null'
        name: check docs config.json
        language: system
        entry: >
          bash -c '
          test=$(find ./docs/src/pages/components-explorer -iname "config.json" -type f -exec grep -Hn "\"description\": null" {} \;) &&
          if [ -n "$test" ]; then echo "Found null description in config.json:"; echo "$test"; false; fi
          '
        pass_filenames: false
        always_run: true

      - id: format-frontend
        name: format (frontend)
        entry: npm --prefix frontend run format
        language: system
        pass_filenames: false
        files: ^frontend/src/.+\.(js|jsx|ts|tsx|json)$

      - id: format-docs
        name: format (docs)
        entry: npm --prefix docs run format
        language: system
        pass_filenames: false
        files: ^docs/src/.+\.(js|jsx|ts|tsx|json|mdx)$

