version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      # requirements-3.9.txt pins numpy/pillow/pycoral for Python 3.9, which is
      # required by the pycoral/EdgeTPU wheels built in docker/Dockerfile.wheels
      # and docker/jetson-nano/Dockerfile.wheels. Newer releases drop 3.9, so the
      # file is maintained by hand. exclude-paths does not suppress security PRs
      # (dependabot/dependabot-core#14408), so those still need manual review.
      - "requirements-3.9.txt"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
    ignore:
      # Newer PyPI OpenCV wheels require numpy>=2, see requirements_ci.txt.
      - dependency-name: "numpy"
        versions: [">=2"]
      # Newer versions does not compile for the Jetson Nano.
      - dependency-name: "pygobject"
        versions: [">3.42.2"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docs:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      devcontainers:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - "*"
