name: CI Frontend

on:
  push:
    branches:
      - dev
      - master
  pull_request: ~

env:
  NODE_VERSION: 24

defaults:
  run:
    working-directory: ./frontend

jobs:
  lint:
    name: Lint and check format
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7.0.1
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run eslint
        run: npm run lint:eslint
      - name: Run prettier
        run: npm run lint:prettier
      - name: Run tsc
        run: npm run lint:types

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7.0.1
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  screenshot-docker-image:
    name: Resolve Playwright image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7.0.1
      - name: Resolve the Playwright image from the lockfile
        id: resolve
        run: echo "image=$(node e2e/playwright-image.mjs)" >> "$GITHUB_OUTPUT"

  screenshots:
    name: Check docs screenshots
    needs: [screenshot-docker-image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.screenshot-docker-image.outputs.image }}
      # Chromium needs a real /dev/shm or it crashes on large pages.
      options: --ipc=host
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7.0.1
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: screenshots-npm-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Check screenshots are up to date
        run: npm run e2e:screenshots:run
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: frontend/test-results/
          retention-days: 7

  build:
    name: Build frontend
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7.0.1
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build
      - name: Assert the mock service worker is not in the production build
        run: |
          if [ -e dist/mockServiceWorker.js ]; then
            echo "::error::dist/mockServiceWorker.js must never ship outside the demo build"
            exit 1
          fi

  demo:
    name: Demo build smoke test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out files from GitHub
        uses: actions/checkout@v7.0.1
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run demo smoke test
        run: npx playwright test -c e2e/playwright.demo.config.ts
